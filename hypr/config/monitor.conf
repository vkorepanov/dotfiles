# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/0.45.0/Configuring/Monitors/

source = ~/.config/hypr/config/defaults.conf

#monitor=$monitor_left,preferred,0x0,1
#monitor=,preferred,0x0,1,bitdepth,10
#monitor=,preferred,0x0,1,bitdepth,10,vrr,1
# monitor=$monitor_right,preferred,3840x0,1

monitorv2 {
    output =
    mode = preferred
    bitdepth = 10
    cm = hdredid
    sdr_max_luminance = 200
    max_luminance = 600
    vrr = false
}


# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
